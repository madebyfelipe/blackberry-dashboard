<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <title>black berry</title>
    <!--
      A barra de título: preto puro, igual ao fundo do app, e é por ela que se
      arrasta a janela. Os botões de minimizar/maximizar/fechar são do sistema
      (titleBarOverlay no Windows e Linux, os semáforos no macOS). O site mora
      numa WebContentsView logo abaixo — ver main.js.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000000;
        user-select: none;
      }
      /*
       * Só os 32px de cima arrastam. Esta página ocupa a janela inteira por
       * baixo do site, e região de arrasto vale mesmo coberta pela view — se
       * o body todo arrastasse, nenhum clique chegaria ao site.
       */
      .barra {
        height: 32px;
        -webkit-app-region: drag;
      }
    </style>
  </head>
  <body>
    <div class="barra"></div>
  </body>
</html>
