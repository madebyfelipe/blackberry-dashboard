<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data:; style-src 'self'; script-src 'self'"
    />
    <title>Compartilhar tela</title>
    <link rel="stylesheet" href="picker.css" />
  </head>
  <body>
    <header class="topo">
      <h1>Compartilhar tela</h1>
      <button class="fechar" id="fechar" type="button" aria-label="Cancelar">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <path d="M3.5 3.5l9 9m0-9l-9 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
      </button>
    </header>

    <nav class="abas" role="tablist">
      <button type="button" role="tab" data-aba="window" aria-selected="true">Janelas</button>
      <button type="button" role="tab" data-aba="screen" aria-selected="false">Telas</button>
    </nav>

    <main class="grade" id="grade" role="listbox" aria-label="O que compartilhar"></main>
    <p class="vazio" id="vazio" hidden>Nada para compartilhar aqui.</p>

    <footer class="rodape">
      <label class="som" id="som-rotulo" hidden>
        <input type="checkbox" id="som" />
        <span class="caixa" aria-hidden="true"></span>
        Compartilhar o som
      </label>
      <div class="acoes">
        <button type="button" class="secundario" id="cancelar">Cancelar</button>
        <button type="button" class="primario" id="compartilhar" disabled>Compartilhar</button>
      </div>
    </footer>

    <script src="picker.js"></script>
  </body>
</html>
